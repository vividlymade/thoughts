name: CI pipeline
on:
  push:
    branches: [ main, dev ]
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Run Unit tests
        run: npm run test:unit -w app
  e2e-tests:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 22.x
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browser (Chromium) and dependencies
      run: npx playwright install --with-deps chromium
    - name: Create .env file
      run: |
        echo "VITE_DB_HOST=localhost" >> .env
        echo "VITE_DB_USER=thoughts" >> .env
        echo "VITE_DB_PORT=5432" >> .env
        echo "VITE_DB_PASSWORD=password" >> .env
        echo "VITE_DB_NAME=thoughts" >> .env
    - name: Start Docker Compose services
      run: docker compose up -d
    - name: Run E2E tests
      run: npm run test:e2e -w app
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: app/playwright-report/
        retention-days: 30
    - name: Stop Docker Compose services
      if: always()
      run: docker compose down